        let currentIndex = 0;
        let score = 0;

        const container = document.getElementById('quiz-container');
        const feedbackDiv = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const resultContainer = document.getElementById('result-container');
        const finalScoreP = document.getElementById('final-score');

        function renderQuestion() {
            container.innerHTML = '';
            feedbackDiv.classList.add('hidden');
            nextBtn.classList.add('hidden');

            const q = questions[currentIndex];
            
            const title = document.createElement('h3');
            title.className = 'font-bold text-xl mb-5 text-gray-800';
            title.innerText = `Câu ${currentIndex + 1}/${questions.length}: ${q.text}`;
            container.appendChild(title);

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn block w-full text-left mb-3 p-4 border rounded-lg bg-gray-50 text-lg hover:bg-blue-50 hover:border-blue-300 transition duration-200';
                btn.innerText = opt;
                btn.onclick = () => handleSelection(optIndex, btn);
                container.appendChild(btn);
            });
        }

        function handleSelection(selectedIndex, clickedBtn) {
            const q = questions[currentIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            
            allBtns.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300', 'cursor-pointer');
                btn.classList.add('cursor-not-allowed', 'opacity-90');
            });

            if (selectedIndex === q.answer) {
                score++;
                clickedBtn.classList.replace('bg-gray-50', 'bg-green-100');
                clickedBtn.classList.add('border-green-500', 'text-green-800', 'font-bold');
                
                feedbackDiv.innerText = "Tuyệt vời! Bạn đã chọn đúng.";
                feedbackDiv.className = "mt-4 text-center font-bold text-lg text-green-600 block";
            } else {
                clickedBtn.classList.replace('bg-gray-50', 'bg-red-100');
                clickedBtn.classList.add('border-red-500', 'text-red-800', 'line-through');
                
                allBtns[q.answer].classList.replace('bg-gray-50', 'bg-green-100');
                allBtns[q.answer].classList.add('border-green-500', 'text-green-800', 'font-bold');
                
                feedbackDiv.innerText = "Sai rồi! Đáp án đúng đã được bôi xanh.";
                feedbackDiv.className = "mt-4 text-center font-bold text-lg text-red-600 block";
            }

            if (currentIndex === questions.length - 1) {
                nextBtn.innerText = "Xem kết quả";
            }
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            container.classList.add('hidden');
            feedbackDiv.classList.add('hidden');
            nextBtn.classList.add('hidden');
            document.querySelector('h1').classList.add('hidden');
            
            resultContainer.classList.remove('hidden');
            finalScoreP.innerText = `Bạn đạt ${score}/${questions.length} điểm.`;
        }

        renderQuestion();
    </script>
</body>
</html>
